# main 머지 → 프로덕션, dev 머지 → 프리뷰
#   프로덕션: https://hashbox-web.pages.dev  ↔ https://hashbox-api.hashbox-team.workers.dev
#   프리뷰:   https://dev.hashbox-web.pages.dev ↔ https://hashbox-api-preview.hashbox-team.workers.dev
name: Deploy

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Set target (production / preview)
        id: t
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "flag=" >> "$GITHUB_OUTPUT"
            echo "api=https://hashbox-api.hashbox-team.workers.dev" >> "$GITHUB_OUTPUT"
            # 발표 전에 false로 바꿔 프로덕션에서 ApiStatus 숨기기
            echo "show_status=true" >> "$GITHUB_OUTPUT"
          else
            echo "flag=--env preview" >> "$GITHUB_OUTPUT"
            echo "api=https://hashbox-api-preview.hashbox-team.workers.dev" >> "$GITHUB_OUTPUT"
            echo "show_status=true" >> "$GITHUB_OUTPUT"
          fi

      - name: API - D1 migrations
        working-directory: apps/api
        run: pnpm exec wrangler d1 migrations apply DB --remote ${{ steps.t.outputs.flag }}

      - name: API - deploy Worker
        working-directory: apps/api
        run: pnpm exec wrangler deploy ${{ steps.t.outputs.flag }}

      - name: Web - build
        run: pnpm --filter @hashbox/web build
        env:
          VITE_API_URL: ${{ steps.t.outputs.api }}
          VITE_SHOW_API_STATUS: ${{ steps.t.outputs.show_status }}

      - name: Web - deploy Pages
        working-directory: apps/api
        run: pnpm exec wrangler pages deploy ../web/dist --project-name hashbox-web --branch ${{ github.ref_name }}
